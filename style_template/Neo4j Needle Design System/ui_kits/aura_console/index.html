<!-- @startingPoint section="Aura Console" subtitle="Instance list, detail and graph query workspace" viewport="1280x820" -->
<!doctype html><html><head><meta charset="utf-8"><title>Aura console — Neo4j Needle</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script>window.__NDL = window.Neo4jNeedleDesignSystem_eb581b || {};</script>
<style>html,body{margin:0;height:100%}#root{height:100vh}</style></head>
<body><div id="root"></div>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="InstancesScreen.jsx"></script>
<script type="text/babel" src="InstanceDetailScreen.jsx"></script>
<script type="text/babel" src="QueryScreen.jsx"></script>
<script type="text/babel" data-presets="react">
var { Button, Badge } = window.__NDL;
function App(){
  const [page,setPage]=React.useState('instances');
  const [instance,setInstance]=React.useState(null);
  const go=(p)=>{setInstance(null);setPage(p)};
  let title, body;
  if(page==='query'){
    title=<div style={{display:'flex',alignItems:'center',gap:8}}><span className="ndl-title-3" style={{color:'var(--text)'}}>Query</span><Badge color="success" hasDot>orders-prod</Badge></div>;
    body=<QueryScreen/>;
  } else if(instance){
    body=<InstanceDetailScreen instance={instance} onBack={()=>setInstance(null)}/>;
    title=<span className="ndl-title-3" style={{color:'var(--text)'}}>{instance.name}</span>;
  } else if(page==='instances'){
    title=<span className="ndl-title-3" style={{color:'var(--text)'}}>Instances</span>;
    body=<InstancesScreen onOpenInstance={setInstance}/>;
  } else {
    title=<span className="ndl-title-3" style={{color:'var(--text)',textTransform:'capitalize'}}>{page}</span>;
    body=<div style={{display:'grid',placeItems:'center',height:'100%',padding:48}}>
      <div style={{textAlign:'center',maxWidth:420,display:'flex',flexDirection:'column',gap:12,alignItems:'center'}}>
        <div className="ndl-title-3" style={{color:'var(--text)'}}>Nothing here yet</div>
        <p className="ndl-body-m" style={{color:'var(--text-weak)',margin:0}}>This surface was not part of the supplied material, so it is left blank rather than invented. Open Instances or Query to see the kit.</p>
        <Button fill="outlined" color="neutral" onClick={()=>go('instances')}>Go to instances</Button>
      </div></div>;
  }
  return <AppShell page={page} onNavigate={go} title={title}>{body}</AppShell>;
}
setTimeout(()=>ReactDOM.createRoot(document.getElementById('root')).render(<App/>),0);
</script></body></html>
