<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--surface);font-family:var(--font-sans)}.w{padding:20px;box-sizing:border-box;height:170px;display:flex;flex-direction:column;justify-content:center}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:88px}.chip{height:48px;border-radius:var(--radius-m);border:1px solid var(--border-weak)}.n{font-size:12px;font-weight:700;color:var(--text);margin-top:6px;letter-spacing:.016rem}.h{font-size:11px;color:var(--text-weakest);font-family:var(--font-code)}</style></head><body><div class="w"><div style="display:flex;gap:24px;background:var(--canvas);padding:20px;border-radius:var(--radius-m)"><div style="flex:1;background:var(--surface);border:1px solid var(--border-weak);border-radius:var(--radius-card);box-shadow:var(--elevation-raised);padding:16px"><div class="ndl-label" style="color:var(--text)">Raised</div><div class="h" style="margin-top:4px">0 1px 2px rgba(26,27,29,.18)</div></div><div style="flex:1;background:var(--surface);border:1px solid var(--border-weak);border-radius:var(--radius-card);box-shadow:var(--elevation-overlay);padding:16px"><div class="ndl-label" style="color:var(--text)">Overlay</div><div class="h" style="margin-top:4px">0 4px 8px rgba(26,27,29,.12)</div></div></div></div></body></html>
