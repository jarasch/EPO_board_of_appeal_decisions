<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<style>html,body{margin:0}body{background:var(--surface)}#root{padding:20px;box-sizing:border-box;min-height:340px}.grp{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.lbl{font:700 11px/1.6 var(--font-code);color:var(--text-weakest);width:78px;flex:0 0 78px;text-transform:uppercase;letter-spacing:.04em}</style></head>
<body><div id="root"></div><script type="text/babel">
const { Banner, Dialog, Tooltip, LoadingSpinner, Button, IconButton } = window.Neo4jNeedleDesignSystem_eb581b;
const Ic = ({d,s=20}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>;
const PLAY="m5 3 14 9-14 9V3z", X="M18 6 6 18M6 6l12 12", PLUS="M12 5v14M5 12h14", SEARCH="m21 21-4.3-4.3M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16", DB="M3 5c0-1.7 4-3 9-3s9 1.3 9 3-4 3-9 3-9-1.3-9-3zM3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5M3 12c0 1.7 4 3 9 3s9-1.3 9-3", TERM="m4 17 6-6-6-6M12 19h8", INFO="M12 16v-4M12 8h.01M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20", ALERT="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z", SPARK="M12 3 13.9 8.6 19.5 10.5 13.9 12.4 12 18 10.1 12.4 4.5 10.5 10.1 8.6z";
function App(){ 
  return <div style={{position:'relative'}}>
    <div style={{display:'flex',flexDirection:'column',gap:12,marginBottom:16}}>
      <Banner type="danger" title="Query failed" icon={<Ic d={ALERT}/>} onDismiss={()=>{}}
        actions={<Button fill="outlined" color="neutral" size="small">View log</Button>}>
        Unknown relationship type <code className="ndl-code">PURCHASED_BY</code>. Run <code className="ndl-code">CALL db.relationshipTypes()</code> to list valid types.
      </Banner>
      <div style={{display:'flex',gap:12}}>
        <div style={{flex:1}}><Banner type="success" title="Instance created" icon={<Ic d={INFO} s={18}/>}/></div>
        <div style={{flex:1}}><Banner type="warning" title="Approaching node limit" icon={<Ic d={ALERT} s={18}/>}/></div>
        <div style={{flex:1}}><Banner type="discovery" title="Generated by Cypher assist" icon={<Ic d={SPARK} s={18}/>}/></div>
      </div>
      <div className="grp" style={{marginBottom:0}}>
        <span className="lbl">Other</span>
        <LoadingSpinner label="Running query…"/>

      </div>
    </div>
    <div style={{position:'relative',height:150,background:'var(--canvas)',borderRadius:'var(--radius-l)',overflow:'hidden'}}>
      <Dialog isOpen title="Delete instance orders-prod?" size="small" onClose={()=>{}}
        actions={<><Button fill="outlined" color="neutral">Cancel</Button><Button color="danger">Delete instance</Button></>}>
        This removes 1.2M nodes and 4.8M relationships. It cannot be undone.
      </Dialog>
    </div>
  </div>; }
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
